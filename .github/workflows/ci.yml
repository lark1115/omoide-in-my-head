name: stage-one
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, macOS, omoide]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: miwa-cli@0.7.0
      - run: python3 verify/check_miwa.py
      - name: SQLite smoke
        run: |
          export OMOIDE_DB="$(mktemp -d "$RUNNER_TEMP/omoide.XXXXXX")/smoke.db"
          target/debug/omoide init | jq -e '.state == "ready"'
          target/debug/omoide recall --scene workshop | jq -e '.state == "none"'
